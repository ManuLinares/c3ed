name: Build and Release c3ed

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup C3 Compiler
        uses: ManuLinares/setup-c3@main
        with:
          version: nightly
          build-type: release

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxcursor-dev \
            libgl1-mesa-dev

      - name: Create dist directory
        run: mkdir -p dist_release

      # 1. Linux
      - name: Build & Package Linux
        run: |
          c3c build linux
          cd build
          zip -9 ../dist_release/c3ed-linux.zip c3ed
          rm -f c3ed
          cd ..

      # 2. Windows
      - name: Build & Package Windows
        run: |
          c3c fetch-sdk windows --accept-license
          c3c build windows
          cd build
          zip -9 ../dist_release/c3ed-windows.zip c3ed.exe
          rm -f c3ed.exe
          cd ..

      # 3. macOS
      - name: Build & Package macOS
        run: |
          c3c fetch-sdk macos --accept-license
          c3c build macos
          cd build
          zip -9 ../dist_release/c3ed-macos.zip c3ed
          rm -f c3ed
          cd ..

      # 4. Upload CI Artifacts
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c3ed-binaries
          path: dist_release/

      # 5. Publish GitHub Release on Tag
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist_release/c3ed-linux.zip \
            dist_release/c3ed-windows.zip \
            dist_release/c3ed-macos.zip \
            --title "c3ed ${{ github.ref_name }}" \
            --generate-notes || \
          gh release upload "${{ github.ref_name }}" \
            dist_release/c3ed-linux.zip \
            dist_release/c3ed-windows.zip \
            dist_release/c3ed-macos.zip \
            --clobber